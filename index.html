<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>旅图 AI — 智能行程规划</title>
<meta name="description" content="AI 驱动的行程规划助手，一键生成互动旅行地图">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sf: ['-apple-system','BlinkMacSystemFont','SF Pro Text','SF Pro Display','Helvetica Neue','Arial','sans-serif'] },
      colors: {
        apple: {
          bg: '#f5f5f7',
          card: '#ffffff',
          text: '#1d1d1f',
          secondary: '#86868b',
          tertiary: '#aeaeb2',
          accent: '#0071e3',
          red: '#ff3b30',
          orange: '#ff9500',
          green: '#34c759',
          blue: '#007aff',
          purple: '#af52de',
          pink: '#ff2d55',
          sep: 'rgba(60,60,67,.12)'
        }
      }
    }
  }
}
</script>
<style>
:root {
  --safe-top: env(safe-area-inset-top,0px);
  --safe-bottom: env(safe-area-inset-bottom,0px);
}
* { -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Arial",sans-serif;
  background: #f5f5f7; color: #1d1d1f; -webkit-font-smoothing: antialiased;
  line-height: 1.47059; letter-spacing: -0.022em;
}

/* Frosted glass */
.glass {
  background: rgba(255,255,255,.85);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
}
.glass-strong {
  background: rgba(255,255,255,.92);
  -webkit-backdrop-filter: saturate(180%) blur(30px);
  backdrop-filter: saturate(180%) blur(30px);
}

/* Map */
#map { width:100%; height:40vh; min-height:280px; position:sticky; top:0; z-index:100; }

/* Tabs — frosted */
.tabs-bar {
  position:sticky; top:40vh; z-index:99;
  border-bottom: .5px solid rgba(60,60,67,.12);
}

/* Scrollbar hide */
.no-scrollbar::-webkit-scrollbar { display:none; }
.no-scrollbar { scrollbar-width:none; }

/* Timeline */
.timeline { position:relative; padding-left:28px; }
.timeline::before {
  content:''; position:absolute; left:9px; top:22px; bottom:22px;
  width:1.5px; background:rgba(60,60,67,.12);
}
.tl-dot {
  position:absolute; left:-22px; top:18px;
  width:12px; height:12px; border-radius:50%; z-index:1;
  box-shadow:0 0 0 3px #f5f5f7;
}

/* Card */
.poi-card { cursor:pointer; transition: box-shadow .2s ease; }
.poi-card:active { box-shadow:0 8px 30px rgba(0,0,0,.12); }

/* Badge */
.badge-sm {
  display:inline-flex; align-items:center; font-size:10px; font-weight:700;
  padding:2px 6px; border-radius:4px; letter-spacing:.01em;
}

/* Payment chips */
.pay-chip { font-size:10px; padding:2px 7px; border-radius:4px; font-weight:600; }

/* Buttons */
.btn-sm {
  display:inline-flex; align-items:center; gap:4px;
  padding:7px 12px; border-radius:8px;
  font-size:12px; font-weight:600; border:none; cursor:pointer;
  text-decoration:none !important; transition:filter .15s;
}
.btn-sm:active { filter:brightness(.9); }

/* Action Sheet */
.as-overlay {
  position:fixed; inset:0; z-index:9999;
  background:rgba(0,0,0,.35); backdrop-filter:blur(2px);
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.as-overlay.show { opacity:1; pointer-events:auto; }
.as-sheet {
  width:100%; max-width:420px; padding:0 8px 34px;
  transform:translateY(100%); transition:transform .3s cubic-bezier(.22,1,.36,1);
}
.as-overlay.show .as-sheet { transform:translateY(0); }
.as-group {
  background:rgba(255,255,255,.88); backdrop-filter:blur(20px);
  border-radius:14px; overflow:hidden; margin-bottom:8px;
}
.as-item {
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:16px; font-size:17px; color:#007aff; font-weight:500;
  border:none; background:none; width:100%; cursor:pointer;
}
.as-item+.as-item { border-top:.5px solid rgba(0,0,0,.12); }
.as-item:active { background:rgba(0,0,0,.06); }

/* Detail expand */
.detail-block { font-size:13px; color:#86868b; line-height:1.6; margin-top:10px; padding-top:10px; border-top:.5px solid rgba(60,60,67,.12); }
.detail-block.hidden { display:none; }

/* Weather alert */
.weather-alert {
  border-left:3px solid #ff9500;
  background:rgba(255,149,0,.06);
}

/* Wizard */
.wizard-step { display:none; }
.wizard-step.active { display:block; }

/* Loading spinner */
@keyframes spin { to { transform:rotate(360deg); } }
.spinner { animation:spin .8s linear infinite; }

/* Leaflet overrides */
.leaflet-popup-content-wrapper {
  border-radius:12px !important; box-shadow:0 8px 30px rgba(0,0,0,.12) !important;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif !important;
}
.leaflet-popup-content { font-size:14px !important; margin:12px 14px !important; }
.leaflet-popup-content a { color:#0071e3 !important; }
.leaflet-control-zoom a {
  width:34px !important; height:34px !important; line-height:34px !important;
  font-size:16px !important; border-radius:10px !important;
  background:rgba(255,255,255,.85) !important;
  -webkit-backdrop-filter:blur(10px) !important; backdrop-filter:blur(10px) !important;
  border:.5px solid rgba(60,60,67,.12) !important; color:#1d1d1f !important;
}
.leaflet-control-zoom { border-radius:12px !important; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.08) !important; border:none !important; }
.leaflet-control-attribution { font-size:9px !important; opacity:.5; }

/* Modal */
.modal-overlay {
  position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,.4);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.modal-overlay.show { opacity:1; pointer-events:auto; }
.modal {
  background:#fff; border-radius:20px; padding:24px;
  width:90%; max-width:400px; max-height:80vh; overflow-y:auto;
  box-shadow:0 8px 40px rgba(0,0,0,.2);
  transform:translateY(20px); transition:transform .3s cubic-bezier(.22,1,.36,1);
}
.modal-overlay.show .modal { transform:translateY(0); }

/* Pulse animation for AI thinking */
@keyframes pulse-dot {
  0%,100% { opacity:.4; }
  50% { opacity:1; }
}
.pulse-dot { animation:pulse-dot 1.4s ease-in-out infinite; }
.pulse-dot:nth-child(2) { animation-delay:.2s; }
.pulse-dot:nth-child(3) { animation-delay:.4s; }
</style>
</head>
<body class="font-sf">

<!-- ═══════════════ AI Wizard Modal ═══════════════ -->
<div class="modal-overlay" id="wizardModal">
  <div class="modal">
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-xl font-bold tracking-[-0.02em]">AI 行程规划</h3>
      <button onclick="closeWizard()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition">✕</button>
    </div>

    <!-- Step 1: Basic Info -->
    <div class="wizard-step active" id="wiz-step-1">
      <p class="text-sm text-gray-500 mb-4">告诉我你的出行计划，AI 帮你排行程</p>
      <div class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">目的地</label>
          <input id="wiz-dest" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition" placeholder="例如：东京">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">出发日期</label>
            <input id="wiz-start" type="date" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">回程日期</label>
            <input id="wiz-end" type="date" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">酒店 / 住宿区域</label>
          <input id="wiz-hotel" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition" placeholder="例如：新宿华盛顿酒店">
        </div>
        <!-- Flight info (collapsible) -->
        <div class="border border-gray-200 rounded-xl overflow-hidden">
          <button type="button" onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('svg').classList.toggle('rotate-180')" class="w-full flex items-center justify-between px-3 py-2.5 text-sm text-gray-500 hover:bg-gray-50 transition">
            <span>✈️ 航班信息（选填）</span>
            <svg class="w-4 h-4 text-gray-400 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="hidden px-3 pb-3 space-y-2.5 bg-gray-50/50">
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">到达航班号</label>
                <input id="wiz-flight-in-no" class="w-full mt-0.5 px-2.5 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition" placeholder="例如：CA925">
              </div>
              <div>
                <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">到达时间</label>
                <input id="wiz-flight-in-time" type="time" class="w-full mt-0.5 px-2.5 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition">
              </div>
            </div>
            <div>
              <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">到达机场 / 航站楼</label>
              <input id="wiz-flight-in-airport" class="w-full mt-0.5 px-2.5 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition" placeholder="例如：成田机场 T1">
            </div>
            <div class="border-t border-gray-200 pt-2.5 mt-2.5">
              <div class="grid grid-cols-2 gap-2.5">
                <div>
                  <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">回程航班号</label>
                  <input id="wiz-flight-out-no" class="w-full mt-0.5 px-2.5 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition" placeholder="例如：CA926">
                </div>
                <div>
                  <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">回程时间</label>
                  <input id="wiz-flight-out-time" type="time" class="w-full mt-0.5 px-2.5 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition">
                </div>
              </div>
              <div class="mt-2.5">
                <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">回程机场 / 航站楼</label>
                <input id="wiz-flight-out-airport" class="w-full mt-0.5 px-2.5 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition" placeholder="例如：成田机场 T1">
              </div>
            </div>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">想去的地方</label>
          <textarea id="wiz-wishlist" rows="3" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition" placeholder="银座、浅草寺、涩谷SKY、筑地市场、秋叶原…"></textarea>
        </div>
      </div>
      <button onclick="wizardNext(2)" class="w-full mt-5 py-3 bg-[#0071e3] text-white rounded-xl font-semibold text-sm hover:bg-[#0077ed] transition active:scale-[.98]">
        下一步 →
      </button>
    </div>

    <!-- Step 2: Preferences -->
    <div class="wizard-step" id="wiz-step-2">
      <p class="text-sm text-gray-500 mb-4">偏好设置，让行程更贴合你</p>
      <div class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">人数 & 节奏</label>
          <div class="grid grid-cols-3 gap-2 mt-1">
            <button class="pref-btn px-3 py-2 rounded-xl border border-gray-200 text-xs font-medium hover:border-blue-300 transition" data-val="两人，能走">👫 两人，能走</button>
            <button class="pref-btn px-3 py-2 rounded-xl border border-gray-200 text-xs font-medium hover:border-blue-300 transition" data-val="带老人/小孩">👨‍👩‍👧 带家人</button>
            <button class="pref-btn px-3 py-2 rounded-xl border border-gray-200 text-xs font-medium hover:border-blue-300 transition" data-val="一个人">🧍 一个人</button>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">喜好标签</label>
          <div class="flex flex-wrap gap-2 mt-1">
            <button class="tag-btn px-3 py-1.5 rounded-full border border-gray-200 text-xs hover:border-blue-300 transition" data-val="咖啡">☕ 咖啡</button>
            <button class="tag-btn px-3 py-1.5 rounded-full border border-gray-200 text-xs hover:border-blue-300 transition" data-val="购物">🛍️ 购物</button>
            <button class="tag-btn px-3 py-1.5 rounded-full border border-gray-200 text-xs hover:border-blue-300 transition" data-val="甜点">🍰 甜点</button>
            <button class="tag-btn px-3 py-1.5 rounded-full border border-gray-200 text-xs hover:border-blue-300 transition" data-val="酒吧">🍸 酒吧</button>
            <button class="tag-btn px-3 py-1.5 rounded-full border border-gray-200 text-xs hover:border-blue-300 transition" data-val="夜景">🌃 夜景</button>
            <button class="tag-btn px-3 py-1.5 rounded-full border border-gray-200 text-xs hover:border-blue-300 transition" data-val="二次元">🎮 二次元</button>
            <button class="tag-btn px-3 py-1.5 rounded-full border border-gray-200 text-xs hover:border-blue-300 transition" data-val="拍照">📸 拍照</button>
            <button class="tag-btn px-3 py-1.5 rounded-full border border-gray-200 text-xs hover:border-blue-300 transition" data-val="温泉">♨️ 温泉</button>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">餐饮预算（人均）</label>
          <select id="wiz-budget" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition">
            <option value="">不限</option>
            <option value="经济">经济 ¥1,000-3,000</option>
            <option value="中等">中等 ¥3,000-8,000</option>
            <option value="高端">高端 ¥8,000-20,000</option>
            <option value="顶级">顶级 ¥20,000+</option>
          </select>
        </div>
      </div>
      <div class="flex gap-3 mt-5">
        <button onclick="wizardNext(1)" class="flex-1 py-3 bg-gray-100 rounded-xl font-semibold text-sm hover:bg-gray-200 transition active:scale-[.98]">← 上一步</button>
        <button onclick="wizardNext(3)" class="flex-1 py-3 bg-[#0071e3] text-white rounded-xl font-semibold text-sm hover:bg-[#0077ed] transition active:scale-[.98]">下一步 →</button>
      </div>
    </div>

    <!-- Step 3: API Key (for AI) -->
    <div class="wizard-step" id="wiz-step-3">
      <p class="text-sm text-gray-500 mb-4">连接 AI 需要 DeepSeek API Key（可选，不填则加载示例行程）</p>
      <div>
        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">DeepSeek API Key</label>
        <input id="wiz-apikey" type="password" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition" placeholder="sk-…">
        <p class="text-[11px] text-gray-400 mt-1.5">仅保存在浏览器本地，不会上传到任何服务器</p>
      </div>
      <div class="flex gap-3 mt-5">
        <button onclick="wizardNext(2)" class="flex-1 py-3 bg-gray-100 rounded-xl font-semibold text-sm hover:bg-gray-200 transition active:scale-[.98]">← 上一步</button>
        <button onclick="runAIPlan()" class="flex-1 py-3 bg-[#0071e3] text-white rounded-xl font-semibold text-sm hover:bg-[#0077ed] transition active:scale-[.98]" id="wiz-submit-btn">
          ✨ 生成行程
        </button>
      </div>
    </div>

    <!-- Loading State -->
    <div class="wizard-step text-center py-8" id="wiz-step-loading">
      <div class="inline-flex items-center gap-1.5 mb-3">
        <div class="w-2.5 h-2.5 bg-[#0071e3] rounded-full pulse-dot"></div>
        <div class="w-2.5 h-2.5 bg-[#0071e3] rounded-full pulse-dot"></div>
        <div class="w-2.5 h-2.5 bg-[#0071e3] rounded-full pulse-dot"></div>
      </div>
      <p class="text-sm text-gray-500" id="wiz-loading-text">AI 正在规划你的行程…</p>
    </div>
  </div>
</div>

<!-- ═══════════════ Settings Modal ═══════════════ -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-xl font-bold tracking-[-0.02em]">⚙️ 设置</h3>
      <button onclick="closeSettings()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition">✕</button>
    </div>
    <div class="space-y-3">
      <div>
        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">DeepSeek API Key</label>
        <input id="settings-apikey" type="password" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition" placeholder="sk-…">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">AI 模型</label>
        <select id="settings-model" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-blue-400 transition">
          <option value="deepseek-v4-pro">DeepSeek V4 Pro（推荐）</option>
          <option value="deepseek-chat">DeepSeek Chat</option>
          <option value="deepseek-reasoner">DeepSeek Reasoner</option>
        </select>
      </div>
      <button onclick="saveSettings()" class="w-full mt-3 py-3 bg-[#0071e3] text-white rounded-xl font-semibold text-sm hover:bg-[#0077ed] transition active:scale-[.98]">
        保存设置
      </button>
      <button onclick="resetTrip()" class="w-full py-2.5 text-sm text-red-500 font-medium hover:bg-red-50 rounded-xl transition active:scale-[.98]">
        恢复默认示例行程
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════ MAIN APP ═══════════════ -->
<div id="map"></div>

<div class="tabs-bar glass" id="tabsBar">
  <div class="flex items-center justify-between px-3">
    <div class="flex gap-1.5 py-2.5 overflow-x-auto no-scrollbar flex-1" id="tabsContainer"></div>
    <button onclick="openWizard()" class="flex-shrink-0 w-8 h-8 rounded-full bg-[#0071e3] text-white flex items-center justify-center text-sm font-bold hover:bg-[#0077ed] transition active:scale-90 ml-2" title="AI 规划">✨</button>
    <button onclick="openSettings()" class="flex-shrink-0 w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-sm hover:bg-gray-300 transition active:scale-90 ml-1" title="设置">⚙️</button>
  </div>
</div>

<div class="max-w-2xl mx-auto px-4 pb-8" id="contentArea" style="padding-bottom:calc(24px + var(--safe-bottom))"></div>

<!-- ═══════════════ Action Sheet ═══════════════ -->
<div class="as-overlay" id="asOverlay">
  <div class="as-sheet">
    <div class="as-group" id="asOpts"></div>
    <div class="as-group"><button class="as-item font-semibold text-gray-500" onclick="closeAS()">取消</button></div>
  </div>
</div>

<!-- ═══════════════ SCRIPTS ═══════════════ -->
<script>
// ╔══════════════════════════════════════════════════════════╗
// ║  DATA — Demo Tokyo 4-Day Itinerary                      ║
// ╚══════════════════════════════════════════════════════════╝

const DEFAULT_HOTEL = {
  name: 'Mitsui Garden Hotel Jingugaien Tokyo Premier',
  lat: 35.6785, lng: 139.7150,
  address: '东京都新宿区霞丘町11-3',
  desc: '毗邻国立竞技场，地铁2分钟，夜景可眺望新宿高楼群'
};

const DEFAULT_DAYS = [
  { id:0, label:'总览', color:'#0071e3', locations:[] },
  {
    id:1, label:'D1', date:'6月14日 周六', title:'新宿 · 降落第一夜',
    color:'#ff9500', region:'新宿',

let map, markers=[], polylines=[], locMarker, locCircle;
const emojis = { food:'🍽️', spot:'📍', drink:'🍺', hotel:'🏨', transport:'🚃' };
const emojiLabels = { food:'餐', spot:'景', drink:'饮', hotel:'宿', transport:'行' };
const typeColors = { food:'#ff3b30', spot:'#007aff', drink:'#af52de', hotel:'#ff9500', transport:'#aeaeb2' };

function initMap() {
  map = L.map('map', {
    center: [HOTEL.lat||35.69, HOTEL.lng||139.74],
    zoom: 12, zoomControl: false, attributionControl: true
  });
  L.control.zoom({ position:'topright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> | 旅図 AI'
  }).addTo(map);

  // Locate control
  const LocCtrl = L.Control.extend({
    options: { position:'bottomright' },
    onAdd() {
      const b = L.DomUtil.create('button');
      b.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>`;
      b.title = '我的位置';
      b.style.cssText = 'width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:none;box-shadow:0 1px 4px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1d1d1f;';
      L.DomEvent.disableClickPropagation(b);
      b.onclick = () => map.locate({ setView:true, maxZoom:15 });
      return b;
    }
  });
  new LocCtrl().addTo(map);

  map.on('locationfound', e => {
    const r = e.accuracy/2;
    if(locMarker){ locMarker.setLatLng(e.latlng); locCircle.setLatLng(e.latlng).setRadius(r); }
    else {
      locMarker = L.marker(e.latlng, {
        icon: L.divIcon({ className:'', html:'<div style="width:14px;height:14px;border-radius:50%;background:#007aff;border:2.5px solid #fff;box-shadow:0 0 6px rgba(0,122,255,.5)"></div>', iconSize:[14,14], iconAnchor:[7,7] }),
        zIndexOffset: 2000
      }).addTo(map);
      locCircle = L.circle(e.latlng, { radius:r, color:'#007aff', fillColor:'#007aff', fillOpacity:.08, weight:1 }).addTo(map);
    }
  });
  map.on('locationerror', ()=>{});

  if(HOTEL.lat) {
    const hIcon = L.divIcon({
      className:'',
      html:`<div style="width:32px;height:32px;border-radius:50%;background:#ff9500;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 3px 12px rgba(255,149,0,.35)">🏨</div>`,
      iconSize:[32,32], iconAnchor:[16,16], popupAnchor:[0,-18]
    });
    L.marker([HOTEL.lat,HOTEL.lng],{icon:hIcon,zIndexOffset:1000}).addTo(map).bindPopup(`<b>${HOTEL.name}</b><br><span style="color:#86868b;font-size:12px">${HOTEL.address||''}</span>`);
  }
}

function mkIcon(color,emoji){
  return L.divIcon({
    className:'',
    html:`<div style="width:30px;height:30px;border-radius:50%;background:${color};border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.18)">${emoji||'📌'}</div>`,
    iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-17]
  });
}

function clearMap(){ markers.forEach(m=>map.removeLayer(m)); polylines.forEach(p=>map.removeLayer(p)); markers=[]; polylines=[]; }

function showDay(idx){
  clearMap();
  if(idx===0){
    const pts=[];
    DAYS.slice(1).forEach(d=>{
      d.locations.forEach(l=>{ if(l.lat) pts.push([l.lat,l.lng]); });
      const dayLocs = d.locations.filter(l=>l.time!=='—'&&l.lat);
      dayLocs.forEach(l=>{
        const m = L.circleMarker([l.lat,l.lng],{radius:5,fillColor:d.color,color:'#fff',weight:2,fillOpacity:.9}).addTo(map).bindPopup(`<b>${l.name}</b><br><span style="color:#86868b;font-size:12px">${d.label} · ${d.title}</span>`);
        markers.push(m);
      });
    });
    if(pts.length) map.fitBounds(pts,{padding:[30,30]});
    return;
  }
  const day=DAYS.find(d=>d.id===idx);
  if(!day) return;
  const coords=[];
  day.locations.forEach(l=>{
    if(!l.lat) return;
    const gmapQ = l.gmap||encodeURIComponent(l.name);
    const pop = `<b>${l.name}</b>${l.time!=='—'?'<br><span style="color:#86868b;font-size:12px">'+l.time+'</span>':''}<br>${l.desc||''}${l.budget?'<br><span style="color:#ff9500;font-size:12px">'+l.budget+'</span>':''}<br><a href="#" onclick="event.preventDefault();openAS('${l.name.replace(/'/g,"\\'")}',${l.lat},${l.lng},'${gmapQ}')">📍 导航</a>`;
    const m = L.marker([l.lat,l.lng],{icon:mkIcon(day.color, emojis[l.type]||'📌')}).addTo(map).bindPopup(pop);
    markers.push(m);
    if(l.time!=='—') coords.push([l.lat,l.lng]);
  });
  if(coords.length>1){
    const pl = L.polyline(coords,{color:day.color,weight:3,opacity:.45,dashArray:'8,6'}).addTo(map);
    polylines.push(pl);
  }
  if(coords.length) map.fitBounds(coords,{padding:[40,40],maxZoom:14});
}

const IN_APP_WEBVIEW = (()=>{
  const ua = (navigator.userAgent||'').toLowerCase();
  return /micromessenger|xhs|xhsdiscover|discover\/|tiktok|aweme|weibo|qq\/|qqbrowser|alipayclient|dingtalk|lark|feishu|ucbrowser|baiduboxapp|toutiao|newsarticle/.test(ua);
})();
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

function xhsKw(loc){
  if(loc.xhsKeyword) return loc.xhsKeyword.trim();
  return (loc.name||'').replace(/⭐.*$/g,'').replace(/（.*?）/g,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
}
function dpKw(loc){
  if(loc.dianpingKeyword) return loc.dianpingKeyword.trim();
  return (loc.name||'').replace(/⭐.*$/g,'').replace(/（.*?）/g,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
}

function xhsAppUrl(loc){ return `xhsdiscover://search/result?keyword=${encodeURIComponent(xhsKw(loc))}&target_search=notes&source=deeplink`; }
function xhsWebUrl(loc){ return `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(xhsKw(loc))}&source=web_explore_feed`; }
function dpAppUrl(loc){ return `dianping://searchshoplist?keyword=${encodeURIComponent(dpKw(loc))}`; }
function dpWebUrl(loc){ return `https://m.dianping.com/searchshop?keyword=${encodeURIComponent(dpKw(loc))}`; }

function openXhsLink(loc){
  window.open(xhsWebUrl(loc), '_blank');
}
function openDpLink(loc){
  window.open(dpWebUrl(loc), '_blank');
}

function openAS(name,lat,lng,gmap){
  const q = gmap||encodeURIComponent(name);
  const enc=encodeURIComponent(name);
  const safe=name.replace(/'/g,"\\'");
  const appleUrl = IN_APP_WEBVIEW
    ? `https://maps.apple.com/?q=${lat},${lng}&ll=${lat},${lng}&name=${enc}`
    : `maps://maps.apple.com/?q=${lat},${lng}&name=${enc}`;
  const googleUrl=`https://www.google.com/maps/search/?api=1&query=${q}`;
  const amapScheme = IS_IOS ? 'iosamap' : 'androidamap';
  const amapApp = `${amapScheme}://viewMap?sourceApplication=trip&poiname=${enc}&lat=${lat}&lon=${lng}&dev=0`;
  const amapWeb = `https://uri.amap.com/marker?position=${lng},${lat}&name=${enc}&src=trip&coordinate=wgs84&callnative=1`;
  document.getElementById('asOpts').innerHTML =
    `<button class="as-item" onclick="window.open('${appleUrl}');closeAS()">🍎 Apple Maps</button>`+
    `<button class="as-item" onclick="window.open('${googleUrl}');closeAS()">🗺️ Google Maps</button>`+

function payChips(pay){
  if(!pay) return '';
  let h='<div class="flex gap-1 flex-wrap mt-1.5">';
  const m={cash:'💴 现金',card:'💳 卡',suica:'Suica',paypay:'PayPay',alipay:'支付宝',wechat:'微信'};
  for(const [k,label] of Object.entries(m)){
    if(pay[k]!==undefined){
      const cls=pay[k]===1?'bg-green-50 text-green-600':'bg-orange-50 text-orange-500';
      const dot=pay[k]===1?'🟢':'🟠';
      h+=`<span class="pay-chip ${cls}">${dot} ${label}</span>`;
    }
  }
  return h+'</div>';
}

function locCard(loc,dayIdx,dayColor){
  const dot=loc.type;
  const uid=`d${dayIdx}-${loc.name.replace(/\W/g,'')}`;
  const gmapQ=loc.gmap||encodeURIComponent(loc.name);
  const safeName=loc.name.replace(/'/g,"\\'");

  // Build action buttons
  let btns='';
  btns+=`<button class="btn-sm bg-[#0071e3] text-white" onclick="event.stopPropagation();openAS('${safeName}',${loc.lat},${loc.lng},'${gmapQ}')">📍 导航</button>`;

  // 小红书 button — compute URL once, embed directly
  const hasXhs = loc.xhs || loc.xhsKeyword;
  if(hasXhs){
    const xu = xhsWebUrl(loc);
    btns+=`<button class="btn-sm bg-[#ff2442] text-white" onclick="event.stopPropagation();window.open('${xu.replace(/'/g,"\\'")}','_blank')">📕 小红书</button>`;
  }

  // 大众点评 button
  const dpOn = loc.dianping !== false && (loc.dianping || loc.dianpingKeyword || loc.type==='food' || loc.type==='drink');
  if(dpOn){
    const du = dpWebUrl(loc);
    btns+=`<button class="btn-sm bg-[#ffa700] text-white" onclick="event.stopPropagation();window.open('${du.replace(/'/g,"\\'")}','_blank')">🍜 大众点评</button>`;
  }

  // Reservation button
  if(loc.reserve){
    btns+=`<a href="${loc.reserve}" target="_blank" class="btn-sm bg-[#34c759] text-white" onclick="event.stopPropagation()">📅 预约</a>`;
  }

  const isAlt = loc.time==='—';
  const dotColor = typeColors[loc.type]||'#aeaeb2';
  const badgeLabel = emojiLabels[loc.type]||'📍';

  return `
  <div class="tl-item relative mb-2.5">
    <div class="tl-dot" style="background:${dotColor}"></div>
    <div class="poi-card bg-white rounded-2xl p-4 shadow-[0_1px_3px_rgba(0,0,0,.06)]" onclick="if(!event.target.closest('button,a'))toggleDetail('${uid}')">
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-semibold tracking-wider ${isAlt?'text-gray-400':'text-gray-400'}">${isAlt?'备选':loc.time}</span>
        <span class="badge-sm bg-opacity-10" style="background:${dotColor}15;color:${dotColor}">${emojis[loc.type]||'📌'} ${badgeLabel}</span>
      </div>
      <div class="text-[17px] font-semibold mt-1 tracking-[-0.01em]">${loc.name}</div>
      <div class="text-[14px] text-gray-500 mt-0.5 leading-relaxed">${loc.desc}</div>
      ${loc.budget?`<div class="inline-block mt-2 px-2.5 py-1 bg-gray-100 rounded-lg text-xs text-gray-500 font-medium">${loc.budget}</div>`:''}
      ${payChips(loc.pay)}
      <div class="flex gap-2 mt-3 flex-wrap">${btns}</div>
      ${loc.detail?`<div class="detail-block hidden" id="${uid}">${loc.detail.replace(/\n/g,'<br>')}</div>`:''}
    </div>
  </div>`;
}

function toggleDetail(id){
  const el=document.getElementById(id);
  if(el) el.classList.toggle('hidden');
}

function renderDay(idx){
  const d=DAYS.find(x=>x.id===idx);
  if(!d) return '';
  const main=d.locations.filter(l=>l.time!=='—');
  const alt=d.locations.filter(l=>l.time==='—');

  let h='';
  // Weather alert
  if(d.weatherNote){
    h+=`<div class="weather-alert rounded-xl px-4 py-3 mb-4 text-sm flex items-start gap-2.5">
      <span class="text-base flex-shrink-0">🌤️</span>
      <div><span class="font-semibold text-gray-800">天气提醒</span><br><span class="text-gray-500 text-xs">${d.weatherNote}</span></div>
    </div>`;
  }

  // Region tag
  if(d.region){
    h+=`<div class="flex items-center gap-2 mb-4">
      <span class="px-3 py-1.5 rounded-full text-xs font-semibold text-white" style="background:${d.color}">${d.region}</span>
      <span class="text-xs text-gray-400">今日主区域，地铁换乘少，路线顺滑</span>
    </div>`;
  }

  h+=`<div class="mb-4"><h2 class="text-[22px] font-bold tracking-[-0.02em]">${d.title}</h2><p class="text-[15px] text-gray-500 mt-0.5">${d.date}</p></div>`;

  if(main.length){
    h+=`<div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">行程</div><div class="timeline">`;
    main.forEach(l=>h+=locCard(l,idx,d.color));
    h+='</div>';
  }
  if(alt.length){
    h+=`<div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mt-6 mb-3">备选</div><div class="timeline">`;
    alt.forEach(l=>h+=locCard(l,idx,d.color));
    h+='</div>';
  }
  return h;
}

function overviewContent(){
  const tripDays = DAYS.slice(1);
  if(!tripDays.length) return '<div class="text-center py-16 text-gray-400">暂无行程数据</div>';

  let dayCards='';
  tripDays.forEach(d=>{
    const spots=d.locations.filter(l=>l.time!=='—').length;
    dayCards+=`
    <div class="poi-card bg-white rounded-2xl p-4 shadow-[0_1px_3px_rgba(0,0,0,.06)] mb-2 cursor-pointer" onclick="go(${d.id})">
      <div class="flex items-center gap-3">
        <div class="w-2 h-2 rounded-full flex-shrink-0" style="background:${d.color}"></div>
        <div class="flex-1 min-w-0">
          <div class="text-[16px] font-semibold tracking-[-0.01em] truncate">${d.label} · ${d.title}</div>
          <div class="text-[13px] text-gray-500 mt-0.5">${d.date} · ${d.region} · ${spots}个点</div>
        </div>
        <svg class="w-4 h-4 text-gray-300 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>`;

  // Region summary
  const regions = [...new Set(tripDays.map(d=>d.region).filter(Boolean))];
  const regionLine = regions.length ? regions.join(' → ') : '';

  // Reservation count
  const resvList=[];
  tripDays.forEach(d=>d.locations.forEach(l=>{if(l.reserve) resvList.push(l.name);}));

  // Cash-only payment warning
  let payWarn='';
  const cashOnly=[];
  tripDays.forEach(d=>d.locations.forEach(l=>{
    if(l.pay&&l.pay.cash===1&&!l.pay.card&&!l.pay.suica) cashOnly.push(l.name);
  }));
  if(cashOnly.length){
    payWarn=`<div class="bg-white rounded-2xl p-4 shadow-[0_1px_3px_rgba(0,0,0,.06)] mb-2">
      <h4 class="text-sm font-bold mb-1.5">⚠️ 现金提醒</h4>
      <p class="text-[13px] text-gray-500 leading-relaxed">以下店铺只收现金：<br><span class="text-red-500 font-medium">${cashOnly.join('、')}</span></p>
    </div>`;
  }

  // Has transport type items?
  const hasTransport = tripDays.some(d=>d.locations.some(l=>l.type==='transport'));

  return `
  <div class="text-center py-7">
    <h1 class="text-[28px] font-bold tracking-[-0.025em] leading-tight">${tripDays.length}日行程</h1>
    <p class="text-[17px] text-gray-500 mt-1.5">${regionLine||'每日一区，路线顺滑'}</p>
  </div>

  <div class="grid grid-cols-2 gap-2.5 mb-5">
    <div class="bg-white rounded-2xl p-4 shadow-[0_1px_3px_rgba(0,0,0,.06)]">
      <div class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1.5">酒店</div>
      <div class="text-[14px] font-semibold leading-snug">${HOTEL.name}</div>
      <div class="text-[11px] text-gray-400 mt-1">${HOTEL.desc||''}</div>
    </div>
    <div class="bg-white rounded-2xl p-4 shadow-[0_1px_3px_rgba(0,0,0,.06)]">
      <div class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1.5">天数 & 区域</div>
      <div class="text-[18px] font-bold">${tripDays.length}天</div>
      <div class="text-[11px] text-gray-400 mt-1">${regions.length}个主区域</div>
    </div>
    <div class="bg-white rounded-2xl p-4 shadow-[0_1px_3px_rgba(0,0,0,.06)]">
      <div class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1.5">预约提醒</div>
      <div class="text-[14px] font-semibold ${resvList.length?'text-orange-500':''}">${resvList.length?resvList.length+'项需预约':'无预约项'}</div>
      <div class="text-[11px] text-gray-400 mt-1">${resvList.length?resvList.slice(0,3).join('、')+(resvList.length>3?'…':''):'—'}</div>
    </div>
    <div class="bg-white rounded-2xl p-4 shadow-[0_1px_3px_rgba(0,0,0,.06)]">
      <div class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1.5">POI 统计</div>
      <div class="text-[18px] font-bold">${tripDays.reduce((s,d)=>s+d.locations.filter(l=>l.time!=='—').length,0)}个点</div>
      <div class="text-[11px] text-gray-400 mt-1">${tripDays.reduce((s,d)=>s+d.locations.filter(l=>l.time==='—').length,0)}个备选</div>
    </div>
  </div>

  ${payWarn}

  <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mt-5 mb-2">行程概览</div>
  ${dayCards}

  <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mt-6 mb-2">图例</div>
  <div class="flex gap-4 flex-wrap text-xs text-gray-500">
    <span>🍽️ 餐厅</span><span>📍 景点</span><span>🍺 饮品</span><span>🏨 酒店</span>${hasTransport?'<span>🚃 交通</span>':''}
  </div>
  <div class="text-[11px] text-gray-400 mt-4 text-center">旅図 AI · 行程是参考坐标，不是执行脚本</div>`;
}

let cur=0;
const tabsContainer=document.getElementById('tabsContainer');
const contentArea=document.getElementById('contentArea');

function buildTabs(){
  tabsContainer.innerHTML='';
  DAYS.forEach(d=>{
    const btn=document.createElement('button');
    btn.className='tab-btn flex-shrink-0 px-4 py-2 rounded-full text-[13px] font-medium transition-all duration-200 whitespace-nowrap';
    btn.dataset.day=d.id;
    btn.textContent=d.label;
    btn.onclick=()=>go(+d.id);
    tabsContainer.appendChild(btn);
  });
}

function go(idx){
  cur=idx;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    const id=+b.dataset.day;
    if(id===idx){ b.className='tab-btn flex-shrink-0 px-4 py-2 rounded-full text-[13px] font-medium bg-[#0071e3] text-white transition-all duration-200 whitespace-nowrap'; }
    else { b.className='tab-btn flex-shrink-0 px-4 py-2 rounded-full text-[13px] font-medium bg-gray-200/70 text-gray-500 transition-all duration-200 whitespace-nowrap'; }
  });
  contentArea.innerHTML = idx===0 ? overviewContent() : renderDay(idx);
  showDay(idx);
  contentArea.scrollTo({top:0,behavior:'smooth'});
  const tb=document.querySelector(`[data-day="${idx}"]`);
  if(tb) tb.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

let wizardStep=1;

  const target=document.getElementById('wiz-step-'+n);
  if(target) target.classList.add('active');

// Preference buttons
document.addEventListener('click',e=>{
  if(e.target.classList.contains('pref-btn')){
    document.querySelectorAll('.pref-btn').forEach(b=>b.classList.remove('bg-blue-50','border-blue-400','text-blue-600'));
    e.target.classList.add('bg-blue-50','border-blue-400','text-blue-600');
    wizardData.pace=e.target.dataset.val;
  }
  if(e.target.classList.contains('tag-btn')){
    const v=e.target.dataset.val;
    if(wizardData.tags.includes(v)){
      wizardData.tags=wizardData.tags.filter(t=>t!==v);
      e.target.classList.remove('bg-blue-50','border-blue-400','text-blue-600');
    } else {
      wizardData.tags.push(v);
      e.target.classList.add('bg-blue-50','border-blue-400','text-blue-600');
    }
  }
});

    const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+apiKey
      },
      body:JSON.stringify({
        model:model,
        max_tokens:8192,
        messages:[
          {role:'system',content:systemPrompt},
          {role:'user',content:userMsg}
        ]
      })
    });

    if(!resp.ok){
      const err=await resp.json().catch(()=>({}));
      throw new Error(err.error?.message||`API 错误 ${resp.status}`);
    }

    document.getElementById('wiz-loading-text').textContent='正在生成地图…';

    const data=await resp.json();
    const text=data.choices?.[0]?.message?.content||'';
    // Extract JSON from response (handle markdown code blocks)
    const jsonMatch=text.match(/```(?:json)?\s*([\s\S]*?)```/)||text.match(/(\{[\s\S]*\})/);
    const jsonStr=jsonMatch?jsonMatch[1]:text;
    const parsed=JSON.parse(jsonStr);

    if(parsed.HOTEL) HOTEL=parsed.HOTEL;
    if(parsed.DAYS) DAYS=parsed.DAYS;

    // Save to localStorage
    try{ localStorage.setItem('trip_data',JSON.stringify({HOTEL,DAYS})); }catch(e){}

    closeWizard();
    buildTabs(); go(0);

  } catch(e){
    console.error('AI planning error:',e);
    document.getElementById('wiz-loading-text').textContent='规划失败: '+e.message+' — 将加载示例行程';
    await new Promise(r=>setTimeout(r,1500));
    HOTEL=JSON.parse(JSON.stringify(DEFAULT_HOTEL));
    DAYS=JSON.parse(JSON.stringify(DEFAULT_DAYS));
    closeWizard();
    buildTabs(); go(0);
  }
}
